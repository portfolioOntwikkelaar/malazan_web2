        <center>

        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 900px;
                 background-color: #0b0b0b;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

    <body>
        <div class="card" style="width: 100%">
            
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([

  // =========================
  // MALAZAN / BRIDGEBURNERS
  // =========================
  {"id":"Whiskeyjack","label":"Whiskeyjack","group":"Human","shape":"dot","size":20,"font":{"color":"white"},"title":"Whiskeyjack<br>Bridgeburner"},
  {"id":"Quick Ben","label":"Quick Ben","group":"Human","shape":"dot","size":20,"font":{"color":"white"},"title":"Quick Ben<br>Mage"},
  {"id":"Fiddler","label":"Fiddler","group":"Human","shape":"dot","size":18,"font":{"color":"white"},"title":"Fiddler<br>Bridgeburner"},
  {"id":"Picker","label":"Picker","group":"Human","shape":"dot","size":16,"font":{"color":"white"},"title":"Picker"},
  {"id":"Blend","label":"Blend","group":"Human","shape":"dot","size":16,"font":{"color":"white"},"title":"Blend"},
  {"id":"Malakai","label":"Malakai","group":"Human","shape":"dot","size":16,"font":{"color":"white"},"title":"Malakai"},
  {"id":"Trotts","label":"Trotts","group":"Human","shape":"dot","size":16,"font":{"color":"white"},"title":"Trotts"},
  {"id":"Spindle","label":"Spindle","group":"Human","shape":"dot","size":16,"font":{"color":"white"},"title":"Spindle"},
  {"id":"Koll","label":"Koll","group":"Human","shape":"dot","size":16,"font":{"color":"white"},"title":"Koll"},

  // =========================
  // DARUJHISTAN
  // =========================
  {"id":"Kruppe","label":"Kruppe","group":"Human","shape":"dot","size":18,"font":{"color":"white"},"title":"Kruppe"},
  {"id":"Baruk","label":"Baruk","group":"Human","shape":"dot","size":18,"font":{"color":"white"},"title":"Baruk<br>Alchemist"},

  // =========================

  // =========================
  {"id":"Caladan Brood","label":"Caladan Brood","group":"Ascendant","shape":"dot","size":28,"font":{"color":"white"},"title":"Caladan Brood"},
  {"id":"Anomander Rake","label":"Anomander Rake","group":"Ascendant","shape":"dot","size":30,"font":{"color":"white"},"title":"Anomander Rake"},

  // =========================
  // GREY SWORDS / CAPUSTAN
  // =========================
  {"id":"Itkovian","label":"Itkovian","group":"Human","shape":"dot","size":22,"font":{"color":"white"},"title":"Itkovian<br>Mortal Sword"},
  {"id":"Brukhalian","label":"Brukhalian","group":"Human","shape":"dot","size":20,"font":{"color":"white"},"title":"Brukhalian"},
  {"id":"Karnadas","label":"Karnadas","group":"Human","shape":"dot","size":18,"font":{"color":"white"},"title":"Karnadas"},
  {"id":"Anaster","label":"Anaster","group":"Human","shape":"dot","size":18,"font":{"color":"white"},"title":"Anaster"},

  // =========================
  // PANNION DOMIN
  // =========================
  {"id":"The Pannion Seer","label":"The Pannion Seer","group":"Ascendant","shape":"dot","size":32,"font":{"color":"white"},"title":"The Pannion Seer"},
  {"id":"The Tenescowri","label":"The Tenescowri","group":"Faction","shape":"dot","size":24,"font":{"color":"white"},"title":"The Tenescowri"},

  // =========================
  // T'LAN IMASS
  // =========================
  {"id":"Tool","label":"Tool","group":"Undead","shape":"dot","size":24,"font":{"color":"white"},"title":"Tool"},
  {"id":"Pran Chole","label":"Pran Chole","group":"Undead","shape":"dot","size":22,"font":{"color":"white"},"title":"Pran Chole"},
  {"id":"Kilava Onass","label":"Kilava Onass","group":"Imass","shape":"dot","size":22,"font":{"color":"white"},"title":"Kilava Onass"},

  // =========================
  // GODS / ELDER
  // =========================
  {"id":"Hood","label":"Hood","group":"God","shape":"dot","size":40,"font":{"color":"white"},"title":"Hood"},
  {"id":"Fener","label":"Fener","group":"God","shape":"dot","size":40,"font":{"color":"white"},"title":"Fener"},
  {"id":"Treach","label":"Treach","group":"God","shape":"dot","size":40,"font":{"color":"white"},"title":"Treach"},
  {"id":"K'rul","label":"K'rul","group":"God","shape":"dot","size":40,"font":{"color":"white"},"title":"K'rul"},
  {"id":"Burn","label":"Burn","group":"God","shape":"dot","size":40,"font":{"color":"white"},"title":"Burn"}

]);


                  edges = new vis.DataSet([

  // Bridgeburners
  {"from":"Whiskeyjack","to":"Quick Ben","color":"green","title":"bondgenoten"},
  {"from":"Whiskeyjack","to":"Fiddler","color":"green","title":"bondgenoten"},
  {"from":"Picker","to":"Blend","color":"green","title":"bondgenoten"},

  // Darujhistan
  {"from":"Kruppe","to":"Baruk","color":"green","title":"bondgenoten"},
  {"from":"Rallick Nom","to":"Torvald Nom","color":"green","title":"familie"},

  // Brood Alliance
  {"from":"Caladan Brood","to":"Anomander Rake","color":"green","title":"bondgenoten"},
  {"from":"Anomander Rake","to":"Korlat","color":"green","title":"bondgenoten"},
  {"from":"Anomander Rake","to":"Orfantal","color":"green","title":"bondgenoten"},
  {"from":"Caladan Brood","to":"Whiskeyjack","color":"green","title":"alliantie"},

  // Kallor conflicts
  {"from":"Kallor","to":"Caladan Brood","color":"red","title":"vijanden"},
  {"from":"Kallor","to":"Anomander Rake","color":"red","title":"vijanden"},
  {"from":"Kallor","to":"Silverfox","color":"red","title":"vijanden"},

  // Capustan
  {"from":"Itkovian","to":"Brukhalian","color":"green","title":"bondgenoten"},
  {"from":"Itkovian","to":"Karnadas","color":"green","title":"bondgenoten"},
  {"from":"Brukhalian","to":"The Pannion Seer","color":"red","title":"vijanden"},

  // Pannion Domin
  {"from":"The Pannion Seer","to":"The Tenescowri","color":"gray","title":"leider"},

  // Silverfox & Imass
  {"from":"Silverfox","to":"Pran Chole","color":"green","title":"bevelhebber"},
  {"from":"Silverfox","to":"Tool","color":"gray","title":"gespannen"},
  {"from":"Kilava Onass","to":"Tool","color":"gray","title":"verwant"},

  // Gods
  {"from":"Itkovian","to":"Fener","color":"gray","title":"Mortal Sword"},
  {"from":"Treach","to":"Fener","color":"red","title":"rivaal"},
  {"from":"K'rul","to":"Burn","color":"green","title":"bondgenoten"},
  {"from":"Hood","to":"Itkovian","color":"gray","title":"erkenning"}

]);


                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": true, "barnesHut": {"gravitationalConstant": -6000, "centralGravity": 0.15, "springLength": 160, "springConstant": 0.04, "damping": 0.12}}, "nodes": {"borderWidth": 1, "shadow": true, "font": {"size": 14}}, "edges": {"smooth": false, "shadow": false}, "interaction": {"hover": true, "tooltipDelay": 100}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
